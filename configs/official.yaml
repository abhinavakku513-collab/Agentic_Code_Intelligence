# Official configuration. Paths resolve from the repo root (D16).
# Its ranking-relevant part is hashed into ModelMeta.revision, so any edit is a new revision: change it only via a
# gate decision, and never between an RC's run and its verification.
#
# Both surfaces run from this one file (D8). Mode B (RC0) is the frozen dense encoder: it reads only `model` and
# `prep`. Mode A adds what the gates accepted: the code-aware BM25 channel (G2), the cross-fitted LambdaRank
# ranker refit on all 5,000 dev queries (G5), and routing v1.1, which keeps the ranker off queries unlike the
# statements it was trained on (spec 10 §4). `primary_mode` stays B until G-AB is recorded.
#
# Query prep is the frozen G1 default (V0, 1024 = 768 head + 256 tail) until G1 is decided on all 5,000 queries.
run:      {mode: AB, primary_mode: B, strict: true, device: cpu, threads: auto_physical, seed: 0, channel: hybrid,
           cold_official: true, test_touch_budget: 6}
model:    {encoder: gte-modernbert-base, dim: 768, config: configs/models/gte-modernbert-base.yaml,
           numeric_profile: cpu-fp32}
prep:     {query: {version: q1, view: V0, max_tokens: 1024, head: 768, tail: 256},
           doc:   {version: d1, max_tokens: 1024, head: 768, tail: 256}}
lexical:  {k1: 1.5, b: 0.75, delta: 0.5, method: lucene, stemmer: english, tokenizer: code}   # G2
retrieve: {dense_k: 100, lexical_k: 30, union_cap: 100, prf: {enabled: false}, top_k_out: 1000}   # G4 undecided: off
rank:     {model: artifacts/ranker/g5-gte-modernbert-code.txt,   # G5: statement_like route
           generic: {alpha: 0.9}}   # generic route: weighted fusion, alpha tuned on CosQA valid only
           # [ledger:dev-2c29126949fa]; held out: CosQA test +0.20 [-0.83,+1.22] [ledger:dev-5b0422eda361],
           # CodeSearchNet-Py +0.76 [+0.30,+1.23] [ledger:dev-e5bae0ac27c0] (scripts/bench/reg_fusion.py)
route:    {bank: artifacts/route/dev_query_bank.npy, tau: 0.6002, k: 8, rho: 0.35}              # routing v1.1
compose:  {mode_a_scores: rank_derived}
# Confidence is a report, never a ranking input: calibrated P(top result relevant) per route [ledger:dev-3a3ccaf55246]
confidence: {calibration: artifacts/confidence/calibration.json}
# Provenance only (an operational section: not hashed). Every decision this file encodes, by ledger row.
gates:
  G_M: {decision: gte-modernbert-base, ledger: gate-055152620da6, file: configs/gates/G-M.yaml}
  G1: {decision: pending — frozen default V0/1024 stands until decided, file: configs/gates/G1.yaml}
  G2: {decision: code tokeniser, file: configs/gates/G2.yaml, note: re-measure from a clean tree before RC1}
  G5: {decision: ship the ranker, file: configs/gates/G5.yaml}
  G3: {decision: pending — Phase 3 runs on a GPU (ADR-0008); frozen base until G3 and G-OOD pass}
  G_AB: {decision: pending — primary stays B}
